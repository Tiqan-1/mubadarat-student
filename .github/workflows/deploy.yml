name: Build and Deploy to mubadarah.github.io

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Create .env from GitHub Environment
        run: |
          echo "VITE_APP_BASE_API=${{ vars.VITE_APP_BASE_API }}" >> .env
          echo "VITE_APP_BASE_PATH=${{ vars.VITE_APP_BASE_PATH }}" >> .env
          echo "VITE_APP_HOMEPAGE=${{ vars.VITE_APP_HOMEPAGE }}" >> .env
          echo "VITE_APP_LOCALE=${{ vars.VITE_APP_LOCALE }}" >> .env
          echo "VITE_APP_NAME=${{ vars.VITE_APP_NAME }}" >> .env
          echo "VITE_APP_ROUTER_MODE=${{ vars.VITE_APP_ROUTER_MODE }}" >> .env
          echo "VITE_MOCK_ENABLED=${{ vars.VITE_MOCK_ENABLED }}" >> .env
          echo "VITE_PUSHER_APP_KEY=${{ secrets.VITE_PUSHER_APP_KEY }}" >> .env
          echo "VITE_PUSHER_CLUSTER=${{ secrets.VITE_PUSHER_CLUSTER }}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Build react app
        run: npm run build

      - name: Deploy to mubadarah.github.io repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.MUBADARAH_DEPLOYMENT_TOKEN }}
          external_repository: Mubadarah/${{ github.ref == 'refs/heads/main' && 'mubadarah.github.io' || 'dev' }}
          publish_branch: main
          publish_dir: ./dist
